name: Publish @beatmagic/codex-ts

on:
  push:
    tags:
      # Trigger on tags like codex-ts/v0.7.1
      - "codex-ts/v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build + test only, skip publish)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub Packages publish uses GITHUB_TOKEN; this is what grants it.
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@beatmagic"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter "@beatmagic/codex-ts" test

      - name: Build
        run: pnpm --filter "@beatmagic/codex-ts" build

      # Extract version from tag (codex-ts/v0.7.1 → 0.7.1)
      - name: Resolve version
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/codex-ts/v}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          PKG=$(node -p "require('./codex-ts/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi

      # GitHub Packages resolves the @beatmagic scope to the repository OWNER, so
      # this repo has to live under the BeatMagic org for GITHUB_TOKEN to be
      # accepted. Publishing from a personal fork fails with 403 even though the
      # token is valid — the scope and the owner must match.
      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        working-directory: codex-ts
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
